name: Health check

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh repository health from the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run health
      - name: Rebuild README
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/repos.json README.md
          git commit -m "Weekly health check"
          git push
      - name: Report archived, moved or missing projects
        if: hashFiles('health-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label health --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file health-report.md
          else
            gh label create health --color 5319e7 --description "Found by the weekly health check" 2>/dev/null || true
            gh issue create --title "Health check: projects need attention" --label health --body-file health-report.md
          fi
