<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Hacking: a maintained map of security resources">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b10"/>
      <stop offset="1" stop-color="#0d1b17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2a25" stroke-width="1"/>
    </pattern>
    <radialGradient id="spot" cx="0.22" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="320" rx="18" fill="url(#spot)"/>

  <!-- window chrome -->
  <circle cx="44" cy="40" r="7" fill="#ef4444" opacity="0.85"/>
  <circle cx="68" cy="40" r="7" fill="#eab308" opacity="0.85"/>
  <circle cx="92" cy="40" r="7" fill="#22c55e" opacity="0.85"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="104" fill="#7c8a83" font-size="22">~/security $ <tspan fill="#d1fae5">learn --practice --defend --legally</tspan></text>
    <text x="60" y="196" font-size="92" font-weight="700" letter-spacing="10" fill="url(#glow)">HACKING</text>
    <rect x="530" y="128" width="26" height="72" fill="#22c55e" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="64" y="244" fill="#cbd5d0" font-size="24">A maintained map of security resources: learn, practice, defend.</text>
    <text x="64" y="282" fill="#6b7a73" font-size="18">courses · labs · tools · references · curated lists · learning paths · weekly health checks</text>
  </g>

  <!-- shield mark -->
  <g transform="translate(1072 64)" fill="none" stroke="url(#glow)" stroke-width="4" stroke-linejoin="round">
    <path d="M90 6 L166 34 V104 C166 150 132 182 90 198 C48 182 14 150 14 104 V34 Z" opacity="0.9"/>
    <path d="M58 104 L82 128 L126 80" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
